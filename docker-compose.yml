x-app: &app
  build:
    context: .
    target: app
    args:
      APP_VERSION: ${APP_VERSION:-local}
  image: shipkit-app:local
  environment: &env
    APP_NAME: Shipkit
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?Set APP_KEY, see README}
    APP_URL: http://localhost:8080
    LOG_CHANNEL: stderr
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_DATABASE: shipkit
    DB_USERNAME: shipkit
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    REDIS_HOST: redis
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_started

services:
  web:
    build:
      context: .
      target: web
    image: shipkit-web:local
    ports:
      - "8080:80"
    depends_on:
      - app

  app:
    <<: *app

  worker:
    <<: *app
    command: php artisan queue:work --tries=3 --max-time=3600

  scheduler:
    <<: *app
    command: php artisan schedule:work

  migrate:
    <<: *app
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan migrate --force
    restart: "no"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shipkit
      MYSQL_USER: shipkit
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine

volumes:
  mysql-data:
