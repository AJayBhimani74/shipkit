name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase owner
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
      - name: Push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          build-args: APP_VERSION=${{ github.ref_name }}
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/shipkit-app:${{ github.ref_name }}
      - name: Push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/shipkit-web:${{ github.ref_name }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    # only runs once you add the repository variable DEPLOY_ENABLED=true and the three secrets below
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "cd /opt/shipkit && ./deploy.sh ${{ github.ref_name }}"
